name: Publish images to ECR

# Builds all six service images and pushes them to Amazon ECR, tagged with the commit SHA.
#
# Authentication uses GitHub OIDC federation (`id-token: write` + an IAM role trust policy),
# NOT long-lived AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY secrets. Nothing static to leak
# or rotate; the role is assumed for the life of the job only.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: Environment whose ECR registry to publish to
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  ECR_NAMESPACE: eshop

permissions:
  contents: read
  id-token: write # required for OIDC federation to AWS

jobs:
  publish:
    name: Publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment || 'staging' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: catalog-api
            dockerfile: src/Services/Catalog/Catalog.API/Dockerfile
          - service: basket-api
            dockerfile: src/Services/Basket/Basket.API/Dockerfile
          - service: discount-grpc
            dockerfile: src/Services/Discount/Discount.Grpc/Dockerfile
          - service: ordering-api
            dockerfile: src/Services/Ordering/Ordering.API/Dockerfile
          - service: yarp-api-gateway
            dockerfile: src/ApiGateways/YarpApiGateway/Dockerfile
          - service: shopping-web
            dockerfile: src/WebApps/Shopping.Web/Dockerfile

    outputs:
      image-tag: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GHA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-publish-${{ matrix.service }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ${{ matrix.dockerfile }}
          push: true
          # Immutable SHA tag is what deploy.yml pins to; `latest` is convenience only.
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_NAMESPACE }}/${{ matrix.service }}:latest
          provenance: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Fail the build on HIGH/CRITICAL CVEs
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-${{ matrix.service }}
          path: trivy-${{ matrix.service }}.sarif
          retention-days: 14
